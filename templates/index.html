<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Printer Timelapse</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e2f;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #4CAF50;
        }
        .video-container {
            margin: 20px 0;
            border: 2px solid #4CAF50;
            border-radius: 8px;
            overflow: hidden;
            background-color: #000;
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .video-container img {
            width: 100%;
            height: auto;
        }
        .controls {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.8;
        }
        #start-btn {
            background-color: #4CAF50;
            color: white;
        }
        #stop-btn {
            background-color: #f44336;
            color: white;
        }
        .status-badge {
            margin-top: 20px;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            background-color: #555;
        }
        .active {
            background-color: #ff9800;
            color: white;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <h1>3D Printer Timelapse</h1>

    <div class="video-container">
        <img src="/video_feed" alt="Live Camera Feed">
    </div>

    <div class="status-badge" id="status-badge">Checking status...</div>

    <div class="controls">
        <button id="start-btn" onclick="startTimelapse()">Start Timelapse</button>
        <button id="stop-btn" onclick="stopTimelapse()">Stop & Render Video</button>
    </div>

    <script>
        async function fetchStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                updateUI(data.active);
            } catch (error) {
                console.error("Error fetching status:", error);
            }
        }

        function updateUI(isActive) {
            const badge = document.getElementById('status-badge');
            const startBtn = document.getElementById('start-btn');
            const stopBtn = document.getElementById('stop-btn');

            if (isActive) {
                badge.innerText = "● RECORDING";
                badge.classList.add('active');
                startBtn.disabled = true;
                startBtn.style.opacity = 0.5;
                stopBtn.disabled = false;
                stopBtn.style.opacity = 1;
            } else {
                badge.innerText = "IDLE";
                badge.classList.remove('active');
                startBtn.disabled = false;
                startBtn.style.opacity = 1;
                stopBtn.disabled = true;
                stopBtn.style.opacity = 0.5;
            }
        }

        async function startTimelapse() {
            try {
                await fetch('/api/start', { method: 'POST' });
                fetchStatus();
            } catch (error) {
                alert("Failed to start timelapse.");
            }
        }

        async function stopTimelapse() {
            try {
                await fetch('/api/stop', { method: 'POST' });
                alert("Timelapse stopped. Video is being rendered in the background.");
                fetchStatus();
            } catch (error) {
                alert("Failed to stop timelapse.");
            }
        }

        // Poll status every 3 seconds
        setInterval(fetchStatus, 3000);
        fetchStatus(); // Initial fetch
    </script>
</body>
</html>
