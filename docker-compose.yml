services:
  timelapse:
    build: .
    container_name: 3dprinter-timelapse
    ports:
      - "5000:5000"
    environment:
      # SET YOUR RTSP CAMERA SETTINGS HERE!
      # The app will automatically combine these securely.
      - RTSP_URL=rtsp://your_camera_ip:554/stream1
      - RTSP_USER=your_username
      - RTSP_PASSWORD=your_password
    volumes:
      - ./data:/app/data
    restart: unless-stopped
